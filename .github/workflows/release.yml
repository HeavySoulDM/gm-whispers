# Релиз по тегу: git tag v0.3.3 && git push --tags → собирается прод-билд (модуль, Core из исходников,
# Core как exe на Windows) и выкладывается в GitHub Releases.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build exe
        working-directory: server
        run: |
          python -m pip install -r requirements.txt "pyinstaller>=6.6"
          python -m PyInstaller --noconfirm --clean gmw_core.spec
      - uses: actions/upload-artifact@v4
        with:
          name: core-exe
          path: server/dist/GM Whispers Core
          if-no-files-found: error
  build:
    needs: exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: core-exe
          path: server/dist/GM Whispers Core
      - name: Build release
        run: python tools/build_release.py --out release
      - name: Check tag matches version
        run: |
          VER=$(python -c "import json;print(json.load(open('foundry-module/gm-whispers/module.json'))['version'])")
          [ "v$VER" = "${GITHUB_REF_NAME}" ] || { echo "Тег ${GITHUB_REF_NAME} не совпадает с версией v$VER"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/module.json
            release/gm-whispers-v*.zip
            release/GM_Whispers_Core-v*.zip
            release/GM_Whispers_Core_exe-v*.zip
            release/CHECKSUMS.txt
          generate_release_notes: true
